фурами, а не штуками — каждая позиция — это полная партия, готовая к отгрузке."},{question:"Какие гарантии, что товар реально есть в наличии?",answer:"Вся информация о товарах синхронизируется с SQL-базами данных, где хранится полная история операций и товарных остатков. Мы интегрируемся напрямую с поставщиками через MCP-шлюзы, что позволяет проверять наличие в реальном времени. Для банкротных активов дополнительно проводим юридическую проверку через 15 AI-агентов, которые сканируют судебные реестры и таможенные данные."},{question:"Как обеспечивается конфиденциальность коммерческих условий?",answer:"ATOMICA — платформа закрытого типа. Доступ предоставляется только по приглашению и после проверки компании. Мы не превращаем платформу в открытый маркетплейс. Коммерческие условия защищены через закрытый контур, где каждый компонент взаимодействует с остальными через API и общие протоколы. Никто, кроме приглашённых партнёров, не видит ваши цены, объёмы или условия."},{question:"Как быстро я могу получить предложение?",answer:"Благодаря автономным агентам и системам парсинга мы видим изменения рынка до того, как они становятся общедоступными. Когда вы запрашиваете партию, система уже имеет актуальные данные. Стандартное предложение формируется за 5–15 минут. Экстренные запросы обрабатываются за 2–3 минуты. Никаких дней ожидания — только минуты."},{question:"Какие валюты и платёжные системы поддерживаются?",answer:"Мы работаем в международной финансовой среде, оперируя 47 фиатными валютами и 12 криптовалютами. Поддерживаются Stripe, PayPal, Wise, банковские SEPA/SWIFT переводы, а также прямые интеграции с ведущими банками. Криптовалютные расчёты позволяют обходить санкционные ограничения и сокращают время расчётов с 5–10 дней до 10 минут. Все конвертации выполняются по курсу реального времени с учётом налогов и комиссий."},{question:"Что такое Zero Human на практике?",answer:"Zero Human — это рабочий стандарт, а не лозунг. Каждое действие в системе ATOMICA — от парсинга рыночной информации до подготовки коммерческого предложения — может выполняться автономно, в режиме 24/7, без задержек и человеческих ошибок. Мы обрабатываем тысячи источников данных в реальном времени, принимаем решения о сделках за минуты и исключаем влияние субъективного фактора. При этом стратегическое управление и ответственность за ключевые решения остаются за руководством компании. Zero Human — это отсутствие лишних звеньев между идеей и результатом, а не отсутствие людей."},{question:"Как подключить партнёров к экосистеме?",answer:"Для контрагентов мы предлагаем бесплатное подключение к экосистеме ATOMICA. Каждый партнёр получает собственного AI-агента, который постоянно синхронизирован с нашей системой, оперативно информирует о новых стоках и изменении цен, предоставляет доступ к калькуляторам фрахта и валютным инструментам, помогает автоматизировать закупки и документооборот. Подключение занимает 1–2 дня. Мы не берём плату за подключение — мы зарабатываем на товарной наценке и заинтересованы в долгосрочном росте каждого партнёра."},{question:"Предоставляете ли вы юридическое сопровождение сделок?",answer:"Да. Все сделки проходят автоматическую юридическую проверку через 15 AI-агентов, которые анализируют договоры, проверяют юридические реквизиты контрагентов и сканируют санкционные списки в реальном времени. Мы работаем с электронной подписью для всех документов и используем blockchain-реестры для подтверждения сертификатов. Юридическая чистота подтверждается аудитом ежеквартально. За каждой сделкой стоит не только алгоритм, но и реальная структура, способная отвечать за результат."}];function XC(){const n=j.useRef(null),i=gn(n,{once:!0,margin:"-100px"}),[s,o]=j.useState(null);return l.jsxs("section",{ref:n,className:"section-shell section-shell--deep py-24 md:py-32 px-6 md:px-10 relative overflow-hidden",children:[l.jsx("div",{className:"section-orb top-[-100px] right-[10%] w-[460px] h-[460px] bg-white/5"}),l.jsx("div",{className:"section-orb bottom-[-120p
